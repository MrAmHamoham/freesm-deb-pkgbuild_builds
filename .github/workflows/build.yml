name: Build Freesm Debian Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup makedeb repository
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl wget gpg
          
          # Add the correct, updated makedeb signing key
          wget -qO - 'https://proget.makedeb.org/debian-feeds/makedeb.pub' | gpg --dearmor | sudo tee /usr/share/keyrings/makedeb-archive-keyring.gpg > /dev/null
          
          # Register the official repository with the fixed 'sources.list.d' path
          echo 'deb [signed-by=/usr/share/keyrings/makedeb-archive-keyring.gpg arch=all] https://proget.makedeb.org/ makedeb main' | sudo tee /etc/apt/sources.list.d/makedeb.list
          
          # Update package index and explicitly install makedeb
          sudo apt-get update
          sudo apt-get install -y makedeb

      - name: Build the package with makedeb
        run: |
          # -s automatically installs missing build dependencies via apt
          makedeb -s

      - name: Upload generated DEB package
        uses: actions/upload-artifact@v4
        with:
          name: freesm-deb-package
          path: ./*.deb
