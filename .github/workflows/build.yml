name: Build Freesm Debian Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup makedeb repository
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl wget gpg
          
          # 1. Download and install the modern Prebuilt MPR archive keyring
          wget -qO - 'https://prebuilt.mpr.io/mpr.gpg' | gpg --dearmor | sudo tee /usr/share/keyrings/mpr-archive-keyring.gpg > /dev/null
          
          # 2. Add the correct, modern package repository
          echo "deb [signed-by=/usr/share/keyrings/mpr-archive-keyring.gpg arch=amd64] https://prebuilt.mpr.io/ makedeb main" | sudo tee /etc/apt/sources.list.d/makedeb.list
          
          # 3. Update apt and install makedeb cleanly without custom scripts
          sudo apt-get update
          sudo apt-get install -y makedeb

      - name: Build the package with makedeb
        run: |
          # Sync dependencies and build the package
          sudo makedeb -s

      - name: Upload generated DEB package
        uses: actions/upload-artifact@v4
        with:
          name: freesm-deb-package
          path: ./*.deb
