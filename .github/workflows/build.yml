name: Build Freesm Debian Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup makedeb repository
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl wget
          
          # Run the installer with '-ci' to cleanly install the stable release without prompting for user input
          bash -ci "$(wget -qO - 'https://shlink.makedeb.org/install')"

      - name: Build the package with makedeb
        run: |
          # -s automatically installs missing build dependencies via apt
          makedeb -s

      - name: Upload generated DEB package
        uses: actions/upload-artifact@v4
        with:
          name: freesm-deb-package
          path: ./*.deb
