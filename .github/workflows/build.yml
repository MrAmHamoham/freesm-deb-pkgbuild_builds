name: Build Freesm Debian Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup makedeb repository
        env:
          # Tells the installer script which release type to deploy headlessly
          MAKEDEB_RELEASE: 'makedeb'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl wget
          
          # Dropped the -i interactive flag to prevent terminal binding errors
          bash -c "$(wget -qO - 'https://shlink.makedeb.org/install')"

      - name: Build the package with makedeb
        run: |
          # Sync missing build tools and generate the .deb payload
          sudo makedeb -s

      - name: Upload generated DEB package
        uses: actions/upload-artifact@v4
        with:
          name: freesm-deb-package
          path: ./*.deb
